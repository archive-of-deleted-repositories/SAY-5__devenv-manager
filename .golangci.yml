version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  exclusions:
    paths:
      - bin
      - frontend
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: error-strings
    gosec:
      excludes:
        - G104
        - G304

formatters:
  enable:
    - gofmt
    - goimports
